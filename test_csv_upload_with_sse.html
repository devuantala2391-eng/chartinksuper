<!DOCTYPE html>
<html>
<head>
    <title>CSV Upload SSE Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .progress-bar {
            width: 100%;
            height: 30px;
            background-color: #f0f0f0;
            border-radius: 5px;
            overflow: hidden;
            margin: 20px 0;
        }
        .progress-fill {
            height: 100%;
            background-color: #4CAF50;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .log {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .log-entry {
            margin: 2px 0;
            padding: 2px 5px;
        }
        .log-error { color: red; }
        .log-success { color: green; }
        .log-info { color: blue; }
    </style>
</head>
<body>
    <h1>CSV Upload SSE Test</h1>
    
    <div>
        <input type="file" id="fileInput" accept=".csv">
        <button onclick="uploadCSV()">Upload CSV</button>
        <button onclick="connectSSE()">Test SSE Connection</button>
    </div>
    
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%">0%</div>
    </div>
    
    <div id="status"></div>
    
    <h3>Logs:</h3>
    <div class="log" id="log"></div>
    
    <script>
        let eventSource = null;
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function updateProgress(percentage, message) {
            const fill = document.getElementById('progressFill');
            fill.style.width = percentage + '%';
            fill.textContent = percentage + '%';
            document.getElementById('status').textContent = message || '';
        }
        
        async function uploadCSV() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a CSV file');
                return;
            }
            
            log('Starting CSV upload...', 'info');
            
            const formData = new FormData();
            formData.append('csvFile', file);
            
            try {
                // First, upload the CSV
                const response = await fetch('http://localhost:8001/upload-csv', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                log(`Upload response: ${JSON.stringify(result)}`, response.ok ? 'success' : 'error');
                
                if (response.ok && result.success) {
                    // Connect to SSE for progress updates
                    connectSSE();
                }
            } catch (error) {
                log(`Upload error: ${error.message}`, 'error');
            }
        }
        
        function connectSSE() {
            // Close existing connection
            if (eventSource) {
                eventSource.close();
                log('Closed existing SSE connection', 'info');
            }
            
            log('Connecting to SSE endpoint...', 'info');
            
            // Connect to the SSE endpoint
            eventSource = new EventSource('http://localhost:8001/csv-upload-progress-stream');
            
            eventSource.onopen = function() {
                log('SSE connection opened', 'success');
            };
            
            eventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    log(`SSE message: ${JSON.stringify(data)}`, 'info');
                    
                    if (data.percentage !== undefined) {
                        updateProgress(data.percentage, data.message);
                    }
                    
                    if (data.phase === 'completed' || data.phase === 'error') {
                        log(`Process ${data.phase}: ${data.message}`, data.phase === 'completed' ? 'success' : 'error');
                        if (data.phase === 'completed') {
                            eventSource.close();
                        }
                    }
                } catch (error) {
                    log(`Error parsing SSE message: ${error.message}`, 'error');
                }
            };
            
            eventSource.onerror = function(error) {
                log('SSE connection error', 'error');
                console.error('SSE Error:', error);
            };
        }
        
        // Clean up on page unload
        window.addEventListener('beforeunload', function() {
            if (eventSource) {
                eventSource.close();
            }
        });
    </script>
</body>
</html>
